<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tillerz Todo Mgr v0.1</title>
<style>
:root{
  --bg:#f5f6f9;--panel:#fff;--ink:#1c2230;--muted:#6b7385;--line:#e2e5ec;--hover:#eef1f6;--sel:#e6ecff;
  --accent:#4f6bed;--accent-ink:#fff;--danger:#d64545;--ok:#2f9e6b;--warn:#d98a1a;
  --shadow:0 6px 24px rgba(20,30,60,.14);--radius:8px;
  --hm0:#e9ecf1;--hm1:#c3e6d2;--hm2:#84cda4;--hm3:#3fa56b;--hm4:#1f7a4d;
  --p1:#6b8ccc;--p2:#8c94a8;--p3:#e8863a;--p4:#e5534b;
}
html[data-theme=dark]{
  --bg:#12151c;--panel:#1a1e28;--ink:#e6e9f0;--muted:#8d95a9;--line:#2a3040;--hover:#232938;--sel:#262f50;
  --accent:#7b93ff;--accent-ink:#10131a;--danger:#ef6b6b;--ok:#4cc08a;--warn:#e8a23c;
  --shadow:0 6px 24px rgba(0,0,0,.5);
  --hm0:#232a38;--hm1:#1f4d3a;--hm2:#2a7a57;--hm3:#3fa56b;--hm4:#74d6a2;
}
/* Themes (Settings → Theme): html[data-style] sets the colours and the font; each has a light and a dark
   version. Only fonts that come with the system, so the app stays offline. */
html[data-style=modern]{--bg:#fafafa;--panel:#fff;--ink:#111318;--muted:#6e7280;--line:#ececef;--hover:#f3f3f5;--sel:#ededf0;
  --accent:#1f2430;--accent-ink:#fff;--danger:#d43d3d;--ok:#2a9d6a;--warn:#c98612;--shadow:0 8px 30px rgba(0,0,0,.08);
  --hm0:#ededf0;--hm1:#cfd2d8;--hm2:#9da2ad;--hm3:#5f6573;--hm4:#1f2430;
  --font:"Segoe UI Variable Text","SF Pro Text","Helvetica Neue",Inter,system-ui,sans-serif}
html[data-style=modern][data-theme=dark]{--bg:#0b0b0d;--panel:#141417;--ink:#ededef;--muted:#8b8b93;--line:#232328;--hover:#1c1c21;--sel:#26262c;
  --accent:#e8e8ea;--accent-ink:#111;--danger:#f06b6b;--ok:#4cc08a;--warn:#e8a23c;--shadow:0 8px 30px rgba(0,0,0,.6);
  --hm0:#1c1c21;--hm1:#3a3a42;--hm2:#64646e;--hm3:#a0a0a8;--hm4:#e8e8ea}
html[data-style=modern] .row{border-radius:6px}html[data-style=modern] .row.sel{box-shadow:inset 2px 0 0 var(--accent)}
html[data-style=modern] header{border-bottom-color:transparent;box-shadow:0 1px 0 var(--line)}

html[data-style=pastel]{--bg:#fbf7f4;--panel:#fffdfb;--ink:#3d3546;--muted:#857a8f;--line:#efe4ea;--hover:#f8eef2;--sel:#f3e8fb;
  --accent:#a46cbd;--accent-ink:#fff;--danger:#d9667a;--ok:#4fa889;--warn:#d9954f;--shadow:0 8px 26px rgba(120,80,140,.14);
  --hm0:#f3ecef;--hm1:#d7f0e4;--hm2:#aee0c9;--hm3:#7cc9a9;--hm4:#4fa889}
html[data-style=pastel][data-theme=dark]{--bg:#221d27;--panel:#2b2531;--ink:#f1e9f3;--muted:#ab9fb3;--line:#3b3343;--hover:#342d3b;--sel:#3f3350;
  --accent:#d4a5e8;--accent-ink:#221d27;--danger:#f29aa8;--ok:#8fd6b6;--warn:#f0c08c;--shadow:0 8px 26px rgba(0,0,0,.5);
  --hm0:#2f2836;--hm1:#2f4a40;--hm2:#3f6e5c;--hm3:#62a68a;--hm4:#9fe0c4}
html[data-style=pastel] .row{border-radius:12px}html[data-style=pastel] .tabs,html[data-style=pastel] .tabs button,html[data-style=pastel] .btn{border-radius:14px}
html[data-style=pastel] .brand i{background:linear-gradient(135deg,#f4a6c0,#a6d8f4)}

html[data-style=fantasy]{--bg:#efe3c8;--panel:#fbf4e3;--ink:#3b2a1a;--muted:#77603f;--line:#dcc9a3;--hover:#f1e4c6;--sel:#ead7ad;
  --accent:#8b2e1f;--accent-ink:#fbf4e3;--danger:#a8321e;--ok:#4f7a3a;--warn:#a86a14;--shadow:0 8px 26px rgba(70,45,15,.22);
  --hm0:#e6d8b8;--hm1:#d6c48f;--hm2:#b9a25c;--hm3:#8f7a35;--hm4:#5e4f1f;
  --font:"Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",Georgia,serif;--fs:15px}
html[data-style=fantasy][data-theme=dark]{--bg:#17120d;--panel:#221a13;--ink:#eadcc0;--muted:#a8946f;--line:#3a2e22;--hover:#2e241b;--sel:#3d2e1f;
  --accent:#d4a84f;--accent-ink:#1b1510;--danger:#d0644c;--ok:#8fb36a;--warn:#e0a64a;--shadow:0 8px 26px rgba(0,0,0,.6);
  --hm0:#2a2119;--hm1:#4a3a22;--hm2:#7a5f2e;--hm3:#b08a3e;--hm4:#e2bb5e}
html[data-style=fantasy] body{background:radial-gradient(ellipse at top,var(--panel),var(--bg) 75%)}
html[data-style=fantasy] .brand{font-variant:small-caps;letter-spacing:1px}html[data-style=fantasy] .brand i{background:linear-gradient(135deg,var(--accent),#c9962e)}
html[data-style=fantasy] h2,html[data-style=fantasy] h3{font-variant:small-caps;letter-spacing:.5px}

html[data-style=scifi]{--bg:#eef3f7;--panel:#fff;--ink:#0f1c2a;--muted:#55697e;--line:#d3dee8;--hover:#e4edf4;--sel:#dcf2fa;
  --accent:#0087ad;--accent-ink:#fff;--danger:#d93a50;--ok:#0e9a78;--warn:#c4850a;--shadow:0 8px 26px rgba(0,60,90,.15);
  --hm0:#e1eaf1;--hm1:#b5e3f0;--hm2:#6cc8e2;--hm3:#1fa3c9;--hm4:#006c8c;
  --font:"Cascadia Code","JetBrains Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;--fs:13px}
html[data-style=scifi][data-theme=dark]{--bg:#070b14;--panel:#0d1422;--ink:#d6f3ff;--muted:#6f8aa6;--line:#1a2a40;--hover:#12203a;--sel:#0f2d45;
  --accent:#2fd4ff;--accent-ink:#04121c;--danger:#ff5470;--ok:#2de0a7;--warn:#ffb547;--shadow:0 8px 30px rgba(0,0,0,.7);
  --hm0:#0f1a2b;--hm1:#0b3a4a;--hm2:#0f6178;--hm3:#1a9cc0;--hm4:#4fe0ff}
html[data-style=scifi] .row{border-radius:3px}html[data-style=scifi] .row.sel{box-shadow:inset 0 0 0 1px var(--accent),0 0 12px color-mix(in srgb,var(--accent) 35%,transparent)}
html[data-style=scifi] .brand{text-transform:uppercase;letter-spacing:2px}html[data-style=scifi] .brand i{border-radius:2px;background:linear-gradient(135deg,var(--accent),#7a5cff)}
html[data-style=scifi] header{border-bottom-color:color-mix(in srgb,var(--accent) 40%,var(--line))}

html[data-style=contrast]{--bg:#fff;--panel:#fff;--ink:#000;--muted:#333;--line:#666;--hover:#e8e8e8;--sel:#d6e4ff;
  --accent:#0040c0;--accent-ink:#fff;--danger:#b00000;--ok:#006b2e;--warn:#8a4b00;--shadow:0 0 0 1px #000;
  --hm0:#e8e8e8;--hm1:#9fd8b4;--hm2:#3fae6e;--hm3:#006b2e;--hm4:#00381a}
html[data-style=contrast][data-theme=dark]{--bg:#000;--panel:#000;--ink:#fff;--muted:#d6d6d6;--line:#999;--hover:#262626;--sel:#00306e;
  --accent:#66b3ff;--accent-ink:#000;--danger:#ff7070;--ok:#4cd98a;--warn:#ffb84d;--shadow:0 0 0 1px #fff;
  --hm0:#262626;--hm1:#1f5a37;--hm2:#2e8a52;--hm3:#4cd98a;--hm4:#a6f5c8}
html[data-style=contrast] .row.sel{box-shadow:inset 0 0 0 2px var(--accent)}
html[data-style=contrast] input:focus,html[data-style=contrast] select:focus,html[data-style=contrast] textarea:focus,html[data-style=contrast] button:focus-visible{outline-width:3px}
*{box-sizing:border-box}
html{color-scheme:light}html[data-theme=dark]{color-scheme:dark}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--muted) 55%,transparent) transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs,14px)/1.4 var(--font,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
[hidden]{display:none!important}

/* header */
header{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.2px;margin-right:8px}
.brand small{font-size:11px;font-weight:600;color:var(--muted);background:var(--hover);padding:1px 6px;border-radius:99px}
.hint{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin:0 2px 10px}
.hint b{color:var(--accent);font-weight:700}
.brand i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#9b6bff);display:grid;place-items:center;color:#fff;font-style:normal;font-size:13px}
.tabs{display:flex;gap:2px;background:var(--hover);padding:3px;border-radius:9px}
.tabs button{padding:5px 12px;border-radius:7px;color:var(--muted);font-weight:600}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sp{flex:1}
.ib{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--muted);position:relative}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib[disabled]{opacity:.35;pointer-events:none}
#btnTimer{width:auto;padding:0 10px;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
#btnTimer.run{background:var(--sel);color:var(--accent);font-weight:600}
#btnTimer.up{background:var(--danger);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}

/* layout */
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 6px var(--detailw,420px);min-height:0}
body[data-view=stats] main{grid-template-columns:minmax(0,1fr)}
body[data-view=stats] #detail,body[data-view=stats] #resizer{display:none}
#resizer{cursor:col-resize;position:relative;touch-action:none}
#resizer::after{content:"";position:absolute;inset:0 2px;border-radius:3px;background:transparent;transition:background .12s}
#resizer:hover::after,#resizer.drag::after{background:var(--accent)}
@media (min-width:1101px){body[data-panel="0"] main{grid-template-columns:minmax(0,1fr)}body[data-panel="0"] #detail,body[data-panel="0"] #resizer{display:none}}
.view{overflow:auto;min-height:0}
.treewrap{max-width:980px;margin:0 auto;padding:14px 16px 90px}
.toolbar{display:flex;gap:8px;margin-bottom:8px}
.toolbar input{flex:1;padding:9px 12px;font-size:14px;border-radius:9px}
.filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.filters .search{position:relative;flex:1 1 180px;max-width:320px}
.filters .search input{width:100%;padding-left:28px}
.filters .search svg{position:absolute;left:8px;top:9px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;background:var(--hover);color:var(--muted);font-size:12px;white-space:nowrap}
button.chip:hover{color:var(--ink)}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.chip .x{opacity:.6;margin-left:2px}
.chip .x:hover{opacity:1}
.scrollx{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.bulk{display:flex;gap:6px;align-items:center;background:var(--sel);padding:6px 10px;border-radius:9px;margin-bottom:8px}
.btn{padding:6px 11px;border-radius:7px;border:1px solid var(--line);background:var(--panel);font-weight:500}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dng{color:var(--danger)}

/* tree */
.tree ul{list-style:none;margin:0;padding:0}
.children{padding-left:22px!important;min-height:2px}
.node>.children:not(:empty){margin-left:9px;border-left:1px solid var(--line)}
.node{border-left:3px solid transparent}
.node.col{border-left-color:var(--c);border-radius:6px 0 0 6px}
.row{--rc:transparent;display:flex;align-items:center;gap:6px;min-height:var(--rowh,36px);padding:2px 6px 2px 2px;border-radius:8px;background:color-mix(in srgb,var(--rc) 7%,transparent);cursor:default;position:relative}
.row:hover{background:color-mix(in srgb,var(--rc) 7%,var(--hover))}
.row.sel{background:var(--sel);box-shadow:inset 0 0 0 1px var(--accent)}
.row.multi{box-shadow:inset 0 0 0 2px var(--accent)}
.row.closed .name{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.row.blocked .name{color:var(--muted)}
.row.drop-hot{outline:2px dashed var(--accent)}
.grip{width:18px;height:28px;display:grid;place-items:center;color:var(--muted);cursor:grab;opacity:0;touch-action:none;flex:none}
.row:hover .grip,.row.sel .grip{opacity:.7}
@media (pointer:coarse){.grip{opacity:.6;width:26px}}
.tw{width:20px;height:24px;display:grid;place-items:center;color:var(--muted);flex:none}
.tw svg{transition:transform .12s}
.tw.open svg{transform:rotate(90deg)}
.tw.none{visibility:hidden}
.chk{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);position:relative;flex:none;background:transparent}
.chk:hover{border-color:var(--accent)}
.chk.st-progress{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.chk.st-waiting{border-color:var(--warn);border-style:dashed}
.chk.st-done{background:var(--ok);border-color:var(--ok)}
.chk.st-done::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.chk.st-cancelled,.chk.st-rejected{opacity:.45}
.chk.st-cancelled::after,.chk.st-rejected::after{content:"";position:absolute;left:2px;right:2px;top:7px;height:2px;background:var(--muted)}
.chk.k-idea{border-radius:4px;transform:rotate(45deg) scale(.78);border-color:var(--warn)}
.chk.k-idea.st-exploring{background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.chk.k-idea.st-parked{border-style:dashed}
.name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:2px 2px}
input.rename{flex:1;padding:3px 6px;font-weight:500}
.badges{display:flex;gap:5px;align-items:center;flex:none}
.bd{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--muted);padding:1px 6px;border-radius:99px;background:var(--hover);white-space:nowrap}
.bd.over{color:#fff;background:var(--danger)}
.bd.today{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.bd.tag{cursor:pointer}
.bd.tag:hover{color:var(--accent)}
.bd.lock{color:var(--warn)}
.flag{display:inline-flex}
.flag.p1{color:var(--p1)}.flag.p2{color:var(--p2)}.flag.p3{color:var(--p3)}.flag.p4{color:var(--p4)}
.prog{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.prog .bar{width:56px;height:6px;border-radius:9px;background:var(--hover);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.prog .bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .2s}
.prog.full .bar i{background:var(--ok)}
.add{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--muted);opacity:0;flex:none}
.row:hover .add,.row.sel .add{opacity:1}
.add:hover{background:var(--hover);color:var(--accent)}
@media (pointer:coarse){.add{opacity:.7}}
.ghost{opacity:.35}
.chosen .row{box-shadow:var(--shadow)}
.empty{color:var(--muted);text-align:center;padding:40px 16px}

.chk.st-later{border-style:dotted;opacity:.7}
.chk.st-active{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.chk.st-planning{border-style:dashed}
.chk.st-paused{border-color:var(--warn);border-style:dashed}
.chk.st-archived{opacity:.45}.chk.st-archived::after{content:"";position:absolute;left:2px;right:2px;top:7px;height:2px;background:var(--muted)}
.chk.k-project{border-radius:6px}
.row.later .name{color:var(--muted);font-style:italic}
.row.proj .name{font-weight:650}
.namewrap{flex:1;min-width:0;display:flex;align-items:center;gap:4px}
.namewrap .name{flex:0 1 auto}
.tic{display:inline-flex;color:var(--muted);flex:none;vertical-align:middle;margin-right:2px}
.tirow{display:flex;align-items:center;gap:8px;margin:4px 0}.tirow .tib{padding:3px 6px;line-height:0}
.tipick{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0;padding:6px;border:1px solid var(--line);border-radius:6px}
.tipick button{padding:5px;border-radius:5px;line-height:0}.tipick button:hover,.tipick button.on{background:var(--sel)}
.urlbtn{flex:none;display:inline-flex;padding:3px;border-radius:6px;color:var(--accent);text-decoration:none}
.urlbtn:hover{background:var(--sel)}
body.notags .bd.tag,body.notags #tagbar{display:none}
.rbell{width:20px;height:20px;display:grid;place-items:center;color:var(--warn);flex:none}
.row.passed .rbell{color:var(--muted);opacity:.6}.row.passed .name{color:var(--muted)}
.bd.rem{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.row.passed .bd.rem{color:var(--muted);background:var(--hover)}
.more{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--muted);opacity:0;flex:none}
.row:hover .more,.row.sel .more{opacity:1}.more:hover{background:var(--hover);color:var(--accent)}
@media (pointer:coarse){.more{opacity:.7}}
.ctx{position:fixed;z-index:80;min-width:230px;max-height:calc(100vh - 12px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px;outline:none;font-size:13.5px}
.ci{position:relative;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:default;white-space:nowrap;outline:none}
.ci:hover,.ci.open{background:var(--hover)}
.ci:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ci.dis{opacity:.4;pointer-events:none}
.ci.danger{color:var(--danger)}
.ci .ck{width:14px;color:var(--accent);font-weight:700;flex:none;text-align:center}
.ci .lb{flex:1}
.ci kbd{margin-left:18px;font-size:11px;color:var(--muted);border:0;background:none;padding:0}
.ci .arr{color:var(--muted);margin-left:14px}
.csep{height:1px;background:var(--line);margin:5px 4px}
.cswatches{display:grid;grid-template-columns:repeat(5,26px);gap:8px;padding:8px 10px}
.sub{display:none;position:fixed;z-index:81;min-width:190px;max-height:calc(100vh - 12px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px}
.ci.open>.sub{display:block}
@media (max-width:600px){.sub{position:static;box-shadow:none;border:0;padding:0 0 0 14px;max-height:none;overflow:visible}.ci.has-sub{flex-wrap:wrap}.ci.has-sub>.sub{flex-basis:100%}}
.sh{margin:18px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;display:flex;gap:6px;align-items:center}
.chk-row{display:flex;gap:8px;align-items:center;margin:6px 0}
.note{font-size:12px;color:var(--muted);margin:2px 0 6px}
.codebox{background:var(--hover);border-radius:8px;padding:8px 10px;font:12px/1.7 ui-monospace,Consolas,monospace;word-break:break-all;margin-top:6px}
/* detail */
.detail{background:var(--panel);border-left:1px solid var(--line);overflow:auto;min-height:0;padding:14px 16px 40px}
.detail .hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.detail h4{margin:16px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;display:flex;gap:6px;align-items:center}
.detail input[data-f=name]{width:100%;font-size:17px;font-weight:600;padding:8px 10px}
.seg{display:inline-flex;background:var(--hover);padding:2px;border-radius:8px;gap:2px}
.seg button{padding:4px 10px;border-radius:6px;color:var(--muted);font-size:13px}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}/* minmax: columns may shrink below their content */
.field{display:flex;flex-direction:column;gap:3px}
.field>span{font-size:12px;color:var(--muted)}
.field.row2{flex-direction:row;gap:6px;flex-wrap:wrap}.row2 input[type=date]{min-width:130px}/* too narrow: the time goes below the date */
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:24px;height:24px;border-radius:50%;background:var(--c);border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sw.none{background:transparent;border:2px dashed var(--line);box-shadow:none}
.sw.on{border-color:var(--ink)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px}
.chips .chip button{opacity:.55;line-height:1}
.chips .chip button:hover{opacity:1}
.stepper{display:flex;gap:6px;align-items:center}
.stepper input[type=number]{width:80px}
.stepper input[type=text]{flex:1}
.bigbar{height:10px;border-radius:9px;background:var(--hover);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bigbar i{display:block;height:100%;background:var(--accent)}
input[type=range]{width:100%;padding:0;accent-color:var(--accent);border:0;background:none}
.list{display:flex;flex-direction:column;gap:3px}
.li{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px;background:var(--hover);font-size:13px}
.li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li a,.li .lnk{color:var(--accent);cursor:pointer;text-decoration:none}
.li button{opacity:.5}.li button:hover{opacity:1}
.dropzone{border:1.5px dashed var(--line);border-radius:8px;padding:8px;text-align:center;color:var(--muted);font-size:12px;margin-top:5px}
.dropzone.drop-hot,#detail.drop-hot .dropzone{border-color:var(--accent);color:var(--accent);background:var(--sel)}
textarea[data-f=notes]{width:100%;min-height:110px;resize:vertical}
.md{padding:8px 10px;border:1px solid var(--line);border-radius:6px;min-height:60px}
.notesbox.max{position:fixed;inset:5vh 6vw;z-index:45;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 16px 16px;box-shadow:0 0 0 100vmax rgba(10,14,25,.45)}
.notesbox.max textarea,.notesbox.max .md{flex:1;min-height:0;overflow:auto;resize:none}
.maxhint{margin-left:auto;font-weight:400;text-transform:none;letter-spacing:normal;font-size:12px}
.copyid{cursor:pointer}
.chk.has-ic{border:none;border-radius:4px;background:none;display:grid;place-items:center;color:var(--muted)}.chk.has-ic::after{display:none}
.chk.has-ic.st-active{color:var(--accent)}.chk.has-ic.st-paused{color:var(--warn)}.chk.has-ic.st-done{color:var(--ok)}.chk.has-ic:hover{color:var(--accent)}
.plan{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0 14px;background:var(--panel)}.plan.over{border-color:var(--danger)}.plan.over .row-between>span:last-child{color:var(--danger)}
.planbar{position:relative;display:flex;height:10px;border-radius:5px;background:var(--hover);margin-top:8px;overflow:hidden}.planbar i{height:100%}.planbar .ev{background:#8a63d2}.planbar .tk{background:var(--accent)}
.planbar b{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;background:var(--ink)}
.elink{color:var(--accent);cursor:pointer;text-decoration:underline dotted}.elink.gone{color:var(--muted);text-decoration:line-through;cursor:default}
.qac small{color:var(--muted);margin-left:6px}
.qac{position:fixed;z-index:70;min-width:180px;max-height:240px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:4px;font-size:13.5px}
.qac .ci.on{background:var(--sel)}
.md p,.md ul,.md ol,.md h1,.md h2,.md h3,.md h4,.md h5,.md h6,.md pre,.md table,.md blockquote,.md .alert{margin:.3em 0}.md code{background:var(--hover);padding:0 4px;border-radius:4px}.md a{color:var(--accent)}
.md h4{font-size:1em;text-transform:none;letter-spacing:normal;color:inherit;display:block}/* not the panel's section label style */
.md ul,.md ol{padding-left:1.5em}.md li:has(>input[type=checkbox]){list-style:none}.md pre{background:var(--hover);padding:6px 8px;border-radius:6px;overflow-x:auto}.md pre code{padding:0}.md img{max-width:100%}
.md blockquote{border-left:3px solid var(--line);padding-left:10px;color:var(--muted)}.md hr{border:0;border-top:1px solid var(--line)}
.md table{border-collapse:collapse}.md th,.md td{border:1px solid var(--line);padding:2px 8px}
.md .alert{border-left:3px solid var(--c);padding:2px 10px}.md .alert>b{color:var(--c)}.md .alert p{margin:.2em 0}
.md .bb-dc{float:left;font-size:3em;line-height:.85;margin:4px 6px 0 0;font-weight:700}.md .bb-code,.md .bb-aloud,.md details{clear:both}
.md .bb-code{font-family:ui-monospace,Consolas,monospace;background:var(--hover);padding:6px 8px;border-radius:6px;margin:.3em 0}
.md .bb-aloud{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--sel);padding:6px 10px;border-radius:6px;margin:.3em 0;font-style:italic}
.md .bb-by{font-size:.9em;margin-top:2px}.md details{margin:.3em 0;border:1px solid var(--line);border-radius:6px;padding:4px 8px}.md summary{cursor:pointer;color:var(--accent)}
.rc{border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin-top:6px}.rc .chk-row{margin:3px 0}.rcnth{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin-left:22px}.rcnth .chk-row{margin:0}
input.bad{border-color:var(--danger);outline-color:var(--danger)}
.alert.note{--c:var(--accent)}.alert.tip{--c:var(--ok)}.alert.important{--c:#8a63d2}.alert.warning{--c:var(--warn)}.alert.caution{--c:var(--danger)}
.hist{font-size:12px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:2px 10px}

/* today / stats */
.page{max-width:1040px;margin:0 auto;padding:16px 16px 80px}
.page h2{margin:18px 0 8px;font-size:15px}
.page h2 small{color:var(--muted);font-weight:400;margin-left:6px}
.trow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;background:var(--panel);margin-bottom:4px;border:1px solid var(--line);border-left:3px solid var(--c,var(--line))}
.trow:hover{background:var(--hover)}
.trow .crumb{color:var(--muted);font-size:12px;margin-left:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto}
.card svg{display:block}
.hm0{fill:var(--hm0)}.hm1{fill:var(--hm1)}.hm2{fill:var(--hm2)}.hm3{fill:var(--hm3)}.hm4{fill:var(--hm4)}
svg text{fill:var(--muted);font-size:10px;font-family:inherit}
.legend{display:flex;gap:4px;align-items:center;justify-content:flex-end;font-size:11px;color:var(--muted);margin-top:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.hbar{display:grid;grid-template-columns:90px 1fr 36px;gap:8px;align-items:center;font-size:13px;margin:4px 0}
.hbar div{height:8px;background:var(--hover);border-radius:9px;overflow:hidden}.hbar i{display:block;height:100%;background:var(--accent)}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

/* overlays */
#modal{position:fixed;inset:0;background:rgba(10,14,25,.45);display:none;z-index:50;align-items:flex-start;justify-content:center;padding-top:10vh}
#modal.show{display:flex}
#modal.pop-right{justify-content:flex-end;align-items:flex-start;padding:54px 12px 0;background:transparent}
#modal.center{align-items:center;padding-top:0}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px;width:min(560px,94vw);max-height:80vh;overflow:auto}
#modal.pop-right .box{width:min(340px,96vw)}
.palette .box{padding:8px}
.palette input{width:100%;border:0;font-size:16px;padding:10px}
.palette ul{list-style:none;margin:6px 0 0;padding:0}
.palette li{padding:7px 10px;border-radius:7px;display:flex;gap:8px;justify-content:space-between;cursor:pointer}
.palette li.on{background:var(--sel)}.palette li small{color:var(--muted)}
.bigclock{font-size:44px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
kbd{background:var(--hover);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font:12px monospace}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}.keys .kg{grid-column:1/-1;margin-top:8px}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;align-items:center;width:max-content;max-width:94vw}
.toast{background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:9px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center}
.toast button{color:var(--accent);font-weight:700;filter:brightness(1.4)}
#tip{position:fixed;z-index:70;background:#222a3c;color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;pointer-events:none;max-width:320px;white-space:pre-line;opacity:0;transition:opacity .1s}
#tip.show{opacity:.96}

/* printable list (right-click → Print list…) */
#print{display:none}
@media print{html,body{background:#fff!important}body>*:not(#print){display:none!important}
  #print{display:block;color:#000;font:11pt/1.35 system-ui,sans-serif}}
#print h1{font-size:16pt;margin:0}#print .pp{color:#555;font-size:9pt;margin-bottom:8px}
#print ul{list-style:none;margin:0;padding-left:20px}#print>ul{padding-left:0;margin-top:8px}#print li{margin:3px 0;break-inside:avoid}
#print .pn{font-weight:600}#print .x>.pn{text-decoration:line-through;color:#666}
#print .pm{color:#444;font-size:9pt}#print .pt{color:#555;font-size:9pt;white-space:pre-line;margin-left:1.4em}

/* responsive */
@media (max-width:1100px){
  main{grid-template-columns:minmax(0,1fr)}
  .detail{position:fixed;right:0;top:0;bottom:0;width:min(var(--detailw,420px),100vw);z-index:30;box-shadow:var(--shadow);transform:translateX(105%);transition:transform .18s}
  .detail.open{transform:none}
  #resizer{display:none;position:fixed;top:0;bottom:0;right:min(var(--detailw,420px),100vw);width:8px;z-index:31}
  body[data-panel="1"] #resizer{display:block}
}
@media (max-width:700px){
  .detail{top:auto;left:0;width:100%;height:82vh;border-radius:14px 14px 0 0;transform:translateY(105%)}
  .detail.open{transform:none}
  #resizer{display:none!important}
  .brand span,.brand small{display:none}
  .badges .tag,.badges .ppl,.badges .loc{display:none}
  .prog .bar{width:36px}
  header{padding:6px 8px}
  .tabs button{padding:5px 9px}
  .grid2{grid-template-columns:1fr}
  .treewrap{padding:10px 8px 90px}
  .children{padding-left:14px!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body data-view="tree">
<header>
  <div class="brand"><i>✓</i><span>Tillerz Todo Mgr</span><small data-tip="Version">v0.1</small></div>
  <nav class="tabs">
    <button data-view="tree" data-tip="Your tree of todos and ideas (key: 1)">Tree</button>

    <button data-view="stats" data-tip="Activity statistics (key: 3)">Stats</button>

  <button class="ib" id="btnPal" data-tip="Command palette (Ctrl+K)"></button>

</header>

      <div class="toolbar"><input id="quick" autocomplete="off" placeholder="Quick add to Inbox — type a name and press Enter  (↑ ↓ = history)"><button class="btn" id="newProj" data-tip="Create a new top-level project">+ Project</button><button class="btn" id="newRem" data-tip="Create a reminder (pops up at a set time, no status)">+ Reminder</button></div>
      <div class="hint"><span><b>#</b>tag</span><span><b>@</b>person</span><span><b>!</b>low|med|high|urgent</span><span><b>due:</b>today|tomorrow|fri|+3d|2026-12-24</span><span><b>~</b>30m|2h estimate</span><span><b>at:</b>19:00</span><span><b>repeat:</b>weekly</span><span>at the start: <b>i:</b> or <b>?</b> idea · <b>p:</b> project · <b>r:</b> reminder · <b>t:</b> todo</span></div>

      <div id="bulk" class="bulk" hidden></div>
      <div id="tree" class="tree"></div>
    </div>
  </section>
  <section id="vToday" class="view" hidden></section>
  <section id="vStats" class="view" hidden></section>
  <div id="resizer" data-tip="Drag to resize the sidebar (double-click to reset)"></div>

</main>

function tagIc(n,s=14){const m=tagIcons(),seen=new Set();
  return n.tags.map(t=>[t,m[t.toLowerCase()]]).filter(([,i])=>P[i]&&!seen.has(i)&&seen.add(i))
    .map(([t,i])=>`<span class="tic" data-tip="#${esc(t)}">${ic(i,s)}</span>`).join('')}

const pad=n=>String(n).padStart(2,'0');
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return dayKey(d)};
function pd(s){if(!s)return null;const[a,t]=s.split('T');const[y,m,d]=a.split('-').map(Number);const[h,mi]=(t||'0:0').split(':').map(Number);return new Date(y,m-1,d,h,mi)}
const startOfToday=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const fmtDur=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.round((s%3600)/60);return h?`${h}h ${m?m+'m':''}`.trim():`${m}m`};
const fmtClock=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+':'+pad(m):m)+':'+pad(s%60)};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmtWhen(s){const d=pd(s);if(!d)return'';const diff=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-startOfToday())/864e5);
  const tm=s.includes('T')?' '+pad(d.getHours())+':'+pad(d.getMinutes()):'';
  if(diff===0)return'Today'+tm;if(diff===1)return'Tomorrow'+tm;if(diff===-1)return'Yesterday'+tm;
  if(diff>1&&diff<7)return DOW[d.getDay()]+tm;return`${d.getDate()} ${MON[d.getMonth()]}${d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():''}${tm}`}
const fmtFull=t=>{const d=new Date(t);return`${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`};
function download(name,text,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

/* ============================ store: talks to the Go server (data/database.json) ============================
   The server is the only writer of the data file. This page keeps a working copy, sends only the entries it
   changed (/api/sync) and refreshes whenever somebody else (another window, the CLI, an AI via MCP) changes data. */
const Store={
  clientId:Math.random().toString(36).slice(2,10),base:0,synced:{},meta:{timer:'null',prefs:'{}'},sentAct:0,q:Promise.resolve(),online:true,es:null,
  async api(method,path,body){
    const r=await fetch(path,{method,headers:{'Content-Type':'application/json','X-Client':this.clientId},body:body===undefined?undefined:(typeof body==='string'?body:JSON.stringify(body))});
    let j=null;try{j=await r.json()}catch{}
    if(!r.ok){const e=new Error((j&&j.error)||('Server answered '+r.status));e.status=r.status;e.data=j;throw e}
    return j},
  enqueue(fn){this.q=this.q.then(fn).catch(e=>console.error(e));return this.q},
  adopt(st){S={v:3,rev:st.rev,nodes:st.nodes,activity:st.activity||[],timer:st.timer==null?null:st.timer,prefs:st.prefs||{}};
    S.prefs.views=S.prefs.views||[];
    this.base=st.rev;this.synced={};for(const id in S.nodes)this.synced[id]=JSON.stringify(S.nodes[id]);
    this.meta={timer:JSON.stringify(S.timer),prefs:JSON.stringify(S.prefs)};this.sentAct=S.activity.length},
  build(){const nodes={},pend={};
    for(const id in S.nodes){const j=JSON.stringify(S.nodes[id]);if(this.synced[id]!==j){nodes[id]=S.nodes[id];pend[id]=j}}
    for(const id in this.synced)if(!(id in S.nodes)){nodes[id]=null;pend[id]=null}
    const acts=S.activity.slice(this.sentAct),tj=JSON.stringify(S.timer),pj=JSON.stringify(S.prefs);
    const timerSet=tj!==this.meta.timer,prefsSet=pj!==this.meta.prefs;
    if(!Object.keys(nodes).length&&!acts.length&&!timerSet&&!prefsSet)return null;
    return{body:{base:this.base,client:this.clientId,nodes,activity:acts,timerSet,timer:S.timer,prefsSet,prefs:S.prefs},pend,acts,tj,pj,timerSet,prefsSet}},
  sync(){return this.enqueue(()=>this.flush())},
  async flush(){const b=this.build();if(!b)return;
    try{const r=await this.api('POST','/api/sync',b.body);
      for(const id in b.pend){if(b.pend[id]===null)delete this.synced[id];else this.synced[id]=b.pend[id]}
      this.sentAct+=b.acts.length;if(b.timerSet)this.meta.timer=b.tj;if(b.prefsSet)this.meta.prefs=b.pj;
      this.setOnline(true);
      if(r.rev===this.base+1)this.base=r.rev;else await this.refresh()}
    catch(e){
      if(e.status===409){toast('Another window, the CLI or an AI changed the same entries — showing the latest data',{ms:7000});await this.refresh()}
      else if(e.status){toast('Could not save: '+e.message,{ms:9000});await this.refresh()}
      else{this.setOnline(false);clearTimeout(this.retry);this.retry=setTimeout(()=>this.sync(),3000)}}},
  async refresh(){const st=await this.api('GET','/api/state');
    const old=ui.sel&&S&&S.nodes[ui.sel]?JSON.stringify(S.nodes[ui.sel]):null;
    this.adopt(st);if(ui.sel&&!S.nodes[ui.sel])ui.sel=null;for(const id of [...ui.multi])if(!S.nodes[id])ui.multi.delete(id);
    U.undo=[];U.redo=[];applyPrefs();applyTheme();renderTree();
    const same=ui.sel&&old===JSON.stringify(S.nodes[ui.sel]);
    if(!(same&&$('#detail').contains(document.activeElement)))renderDetail();
    renderTimerBtn();chrome();this.setOnline(true);syncAlerts()},
  connect(){if(this.es)return;const es=this.es=new EventSource('/api/events');
    es.addEventListener('hello',e=>{this.setOnline(true);if(JSON.parse(e.data).rev!==this.base)this.enqueue(async()=>{await this.flush();await this.refresh()})});
    es.addEventListener('change',e=>{if(JSON.parse(e.data).client===this.clientId)return;this.enqueue(async()=>{await this.flush();await this.refresh()})});
    es.addEventListener('reload',()=>this.enqueue(async()=>{await this.refresh();toast('Data was replaced (import or backup restore)')}));
    es.onerror=()=>this.setOnline(false)},
  setOnline(v){this.online=v;const c=$('#conn');if(c)c.hidden=v},
  beacon(){const b=this.build();if(b)navigator.sendBeacon('/api/sync',new Blob([JSON.stringify(b.body)],{type:'application/json'}))}
};

/* ============================ model ============================ */
const STAT={open:'To do',progress:'In progress',waiting:'Waiting',later:'Later',done:'Done',cancelled:'Cancelled',raw:'Raw idea',exploring:'Exploring',parked:'Parked',rejected:'Rejected',planning:'Planning',active:'Active',paused:'On hold',archived:'Archived',set:'Reminder'};
const STAT_TIP={later:'Postponed to some later time — no plan for it yet. Hidden from Today.',waiting:'Waiting for someone or something else',paused:'Project is on hold'};
const KS={todo:['open','progress','waiting','later','done','cancelled'],idea:['raw','exploring','parked','rejected'],project:['planning','active','paused','done','archived'],reminder:['set']};
const REOPEN={todo:'open',idea:'raw',project:'active',reminder:'set'};
const CLOSED=new Set(['done','cancelled','rejected','archived']);
const PRIO=['None','Low','Medium','High','Urgent'];
const COLORS=['#e5534b','#e8863a','#d9a520','#3fa56b','#2aa6a0','#4a7de0','#8a63d2','#d6578f','#7d8596'];
const RECUR={'':'Does not repeat',d:'Daily',w:'Weekly','2w':'Every 2 weeks','4w':'Every 4 weeks',m:'Monthly',y:'Yearly'};
// repeat rules, the same as recur.go: d w m y, every N (2w 3d 6m), monthly on weekdays (m:1fr,3fr,-1fr)
const RE_RECUR=/^(?:([1-9]\d{0,2})?([dwmy])|m:((?:-1|[1-5])(?:mo|tu|we|th|fr|sa|su)(?:,(?:-1|[1-5])(?:mo|tu|we|th|fr|sa|su))*))(\+)?$/;
const WDS=['su','mo','tu','we','th','fr','sa'],WDN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],NTH={1:'1st',2:'2nd',3:'3rd',4:'4th',5:'5th','-1':'last'};
const UNIT={d:['day','days'],w:['week','weeks'],m:['month','months'],y:['year','years']};
function normRecur(v){v=String(v||'').trim().toLowerCase();const p=v.endsWith('+')?'+':'',w={daily:'d',weekly:'w',monthly:'m',yearly:'y','1d':'d','1w':'w','1m':'m','1y':'y'}[v.slice(0,v.length-p.length)];
  if(w)v=w+p;return v===''||RE_RECUR.test(v)?v:null}
function recurText(r){const m=RE_RECUR.exec(r||'');if(!m)return'';
  if(m[4]&&!m[3]){const n=+(m[1]||1);return`${n} ${UNIT[m[2]][n===1?0:1]} after done`}
  if(m[3]){const by={};m[3].split(',').forEach(x=>{const k=x.slice(-2);(by[k]=by[k]||[]).push(NTH[x.slice(0,-2)])});
    const list=a=>a.length>1?a.slice(0,-1).join(', ')+' and '+a[a.length-1]:a[0];
    return'monthly on the '+list(Object.entries(by).map(([k,a])=>list(a)+' '+WDN[WDS.indexOf(k)]))+(m[4]?' after done':'')}
  const n=+(m[1]||1);return n===1?{d:'daily',w:'weekly',m:'monthly',y:'yearly'}[m[2]]:`every ${n} ${UNIT[m[2]][1]}`}
let S,ui={sel:null,multi:new Set(),view:'tree',q:'',hideDone:false,panel:false,metric:'closed',dragging:false};
const blank=()=>({v:2,rev:0,nodes:{root:{id:'root',name:'root',children:[]}},activity:[],timer:null,prefs:{theme:null,views:[]}});
function uid(){let i;do i=Math.random().toString(36).slice(2,8);while(S.nodes[i]);return i}
function mk(name,p={}){const id=uid(),t=now();return S.nodes[id]={id,name,kind:'todo',status:'open',color:'',prio:0,icon:'',tags:[],people:[],location:'',deadline:'',reminder:'',end:'',deps:[],notes:'',notesFormat:'markdown',links:[],
  prog:{mode:'percent',done:0,total:100,unit:''},recur:'',est:0,time:[],url:'',webhook:'',collapsed:false,created:t,updated:t,parent:null,children:[],hist:[{s:p.status||'open',at:t}],...p}}
const isClosed=n=>CLOSED.has(n.status);
const kids=n=>n.children.map(i=>S.nodes[i]).filter(c=>c&&c.status!=='cancelled'&&c.status!=='rejected'&&c.status!=='archived'&&c.kind!=='reminder');
function detach(n){const p=S.nodes[n.parent];if(p){const i=p.children.indexOf(n.id);if(i>=0)p.children.splice(i,1)}}
function attach(n,pid,idx){const p=S.nodes[pid];n.parent=pid;if(idx==null||idx<0||idx>p.children.length)idx=p.children.length;p.children.splice(idx,0,n.id)}
const inSubtree=(id,anc)=>{for(let x=S.nodes[id];x;x=S.nodes[x.parent])if(x.id===anc)return true;return false};
function moveNode(id,pid,idx){if(inSubtree(pid,id))return false;const n=S.nodes[id];detach(n);attach(n,pid,idx);log('move',id);touch(n,true);return true}
function log(type,id,x){S.activity.push({t:now(),id,type,by:'ui',...x})}
function touch(n,quiet){n.updated=now();if(!quiet){const l=S.activity[S.activity.length-1];if(!(l&&l.id===n.id&&l.type==='edit'&&now()-l.t<60000))log('edit',n.id)}}
function blocked(n){return n.deps.some(d=>{const x=S.nodes[d];return x&&!x.trashed&&x.status!=='done'&&x.status!=='cancelled'})}
function frac(n){const k=kids(n);if(k.length)return k.reduce((a,c)=>a+frac(c),0)/k.length;if(n.status==='done')return 1;return Math.min(1,n.prog.done/(n.prog.total||1))}
const complete=n=>n.prog.mode==='percent'?100:n.prog.total;
function dueState(n){const d=pd(n.deadline);if(!d)return'';const timed=n.deadline.includes('T');
  if(isClosed(n))return'';if(timed?d<new Date():d<startOfToday())return'over';
  if(dayKey(d)===dayKey(new Date()))return'today';return'soon'}
function path(n){const a=[];for(let x=S.nodes[n.parent];x&&x.id!=='root';x=S.nodes[x.parent])a.unshift(x.name);return a.join(' › ')}
function allNodes(){return Object.values(S.nodes).filter(n=>n.id!=='root'&&!n.trashed)}
function treeTime(n){let s=n.time.reduce((a,t)=>a+t.secs,0);n.children.forEach(c=>{if(S.nodes[c])s+=treeTime(S.nodes[c])});return s}

const ANN=[];let annQueue=[];

  openModal(`<h3 style="margin-top:0">${ic('send',16)} Announce on Discord</h3><p style="color:var(--muted);margin:.2em 0 12px">Post “${esc(n.name)}” to the Discord channel of project <b>${esc(pr.name)}</b>?${annQueue.length>1?` <small>(${annQueue.length-1} more waiting)</small>`:''}</p>

function setStatus(n,s){if(n.kind==='reminder'||n.status===s)return;const wasClosed=isClosed(n);n.status=s;n.hist.push({s,at:now()});n.updated=now();log(s==='done'?'close':'status',n.id,{s});if(s==='done'&&n.kind==='todo')ANN.push(n.id);
  if(s==='done'){if(n.prog.mode==='percent')n.prog.done=100;else n.prog.done=n.prog.total;if(n.recur&&!kids(n).length)recurNext(n);else parentHint(n)}
  else if(wasClosed&&n.status!=='cancelled')parentHint(n)}
function parentHint(n){const p=S.nodes[n.parent];if(!p||p.id==='root'||isClosed(p))return;const k=kids(p);
  if(k.length&&k.every(c=>c.status==='done'))toast(`All sub-items of “${p.name}” are done`,{action:{label:'Mark parent done',fn:()=>mutate(()=>setStatus(p,'done'),{panel:true})},ms:7000})}
function recurNext(n){const step=s=>nextOcc(s,n.recur);
  n.status='open';n.hist.push({s:'open',at:now()});n.prog.done=0;n.remDone=false;
  if(n.recur.endsWith('+'))[n.deadline,n.reminder]=afterDone(n.deadline,n.reminder,n.recur,dayKey(now()));
  else{if(n.deadline)n.deadline=step(n.deadline);if(n.reminder)n.reminder=step(n.reminder)}
  toast(`Repeats ${recurText(n.recur)} — next: ${n.deadline?fmtWhen(n.deadline):'reopened'}`)}
function setProgress(n,v){const c=complete(n);v=Math.max(0,Math.min(c,Math.round(+v||0)));n.prog.done=v;log('progress',n.id);n.updated=now();
  if(v>=c&&n.status!=='done'&&n.kind==='todo')setStatus(n,'done');
  else if(v>0&&v<c&&n.status==='open')setStatus(n,'progress');
  else if(v<c&&n.status==='done')setStatus(n,'progress')}
function toggleDone(n){if(n.kind==='idea')return setStatus(n,n.status==='raw'?'exploring':'raw');
  setStatus(n,isClosed(n)?REOPEN[n.kind]:'done')}
function addNode(pid,idx,name,props){let n;mutate(()=>{n=mk(name,props);attach(n,pid,idx);const p=S.nodes[pid];if(p.collapsed)p.collapsed=false;log('create',n.id)});return n}

function inboxId(){let id=S.nodes.root.children.map(i=>S.nodes[i]).find(c=>c.name==='Inbox');if(!id){push();id=mk('Inbox');attach(id,'root',0)}return id.id}
function trash(ids){ids=[].concat(ids);mutate(()=>ids.forEach(id=>{const n=S.nodes[id];if(!n||n.trashed)return;n.trashed=now();n.tparent=n.parent;detach(n);n.parent=null;log('trash',id)}),{panel:true});
  if(ids.includes(ui.sel))ui.sel=null;ui.multi.clear();renderAll();toast(`Moved ${ids.length} item${ids.length>1?'s':''} to trash`,{action:{label:'Undo',fn:undo}})}

function dupNode(id,pid,idx,top){const o=S.nodes[id],n=mk(top?o.name+' (copy)':o.name,JSON.parse(JSON.stringify({...o,id:undefined,name:undefined,children:[],parent:null,hist:undefined,time:[],created:undefined,updated:undefined,trashed:undefined,alert:undefined,snoozeUntil:undefined,preDone:undefined,atDone:undefined,remDone:undefined})));
  n.hist=[{s:n.status,at:now()}];attach(n,pid,idx);o.children.forEach(c=>S.nodes[c]&&dupNode(c,n.id,null,false));return n}
function indent(id){const n=S.nodes[id],p=S.nodes[n.parent],i=p.children.indexOf(id);if(i<1)return;const prev=S.nodes[p.children[i-1]];mutate(()=>{moveNode(id,prev.id);prev.collapsed=false})}
function outdent(id){const n=S.nodes[id],p=S.nodes[n.parent];if(!p||p.id==='root')return;mutate(()=>moveNode(id,p.parent,S.nodes[p.parent].children.indexOf(p.id)+1))}

/* ---- quick add ---- */
function parseWhen(v){v=v.toLowerCase();if(v==='today')return addDays(0);if(v==='tomorrow'||v==='tom')return addDays(1);
  let m=v.match(/^\+(\d+)([dw])$/);if(m)return addDays(+m[1]*(m[2]==='w'?7:1));
  const i=['sun','mon','tue','wed','thu','fri','sat'].indexOf(v.slice(0,3));if(i>=0&&v.length>=3){const d=new Date();let diff=(i-d.getDay()+7)%7||7;return addDays(diff)}
  if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;if(/^\d{2}-\d{2}$/.test(v)){const y=new Date().getFullYear();return y+'-'+v}return''}
// t: todo (the default), i: or ? idea, p: project, r: reminder; same as parseQuick in ops.go
function parseQuick(txt){const o={tags:[],people:[]},k=txt.match(/^(?:([tipr]):|\?)\s*/i);
  if(k){txt=txt.slice(k[0].length);const c=(k[1]||'i').toLowerCase();
    if(c==='r'){o.kind='reminder';o.status='set';o.lead=15}else if(c==='i'){o.kind='idea';o.status='raw'}else if(c==='p'){o.kind='project';o.status='planning'}}
  const PR={low:1,l:1,med:2,medium:2,m:2,high:3,h:3,urgent:4,u:4,'1':1,'2':2,'3':3,'4':4};
  txt=txt.replace(/(^|\s)(due:|at:|repeat:|[#@!~])(\S+)/g,(m,sp,k,v)=>{
    if(k==='#')o.tags.push(v);else if(k==='@')o.people.push(v);else if(k==='!'&&PR[v.toLowerCase()])o.prio=PR[v.toLowerCase()];
    else if(k==='~'){const mm=v.match(/^(\d+)(m|h)?$/);if(mm)o.est=+mm[1]*(mm[2]==='h'?60:1)}
    else if(k==='due:'){const w=parseWhen(v);if(w)o.deadline=w}
    else if(k==='at:'){if(/^\d{1,2}:\d{2}$/.test(v))o.time=v.padStart(5,'0')}
    else if(k==='repeat:'){const r=normRecur(v);if(r)o.recur=r;else return m}else return m;return sp});
  if(o.kind==='reminder'){let d=o.deadline;const tm=o.time;delete o.deadline;delete o.time;
    if(!d&&!tm)o.reminder=defaultRemTime();else{if(!d){d=addDays(0);if(tm&&pd(d+'T'+tm)<=new Date())d=addDays(1)}o.reminder=tm?d+'T'+tm:d}}
  else if(o.time&&o.deadline){o.deadline+='T'+o.time;delete o.time}else delete o.time;
  return{name:txt.replace(/\s+/g,' ').trim(),props:o}}

/* ============================ filtering ============================ */
function parseQ(q){const Q={terms:[],tags:[],people:[],is:[],prio:0};q.toLowerCase().split(/\s+/).filter(Boolean).forEach(t=>{
  if(t[0]==='#'&&t.length>1)Q.tags.push(t.slice(1));else if(t[0]==='@'&&t.length>1)Q.people.push(t.slice(1));
  else if(t[0]==='!'&&t.length>1){Q.prio=Math.max(1,['','low','med','high','urgent'].findIndex(x=>x.startsWith(t.slice(1))))}
  else if(t.startsWith('is:'))Q.is.push(t.slice(3));else Q.terms.push(t)});return Q}
function matches(n,Q){
  const hay=(n.name+' '+n.notes+' '+n.location+' '+n.tags.join(' ')+' '+n.people.join(' ')).toLowerCase();
  if(!Q.terms.every(t=>hay.includes(t)))return false;
  if(!Q.tags.every(t=>n.tags.some(x=>x.toLowerCase().startsWith(t))))return false;
  if(!Q.people.every(t=>n.people.some(x=>x.toLowerCase().startsWith(t))))return false;
  if(Q.prio&&n.prio<Q.prio)return false;
  return Q.is.every(f=>({open:!isClosed(n),done:n.status==='done',closed:isClosed(n),blocked:blocked(n),overdue:dueState(n)==='over',idea:n.kind==='idea',todo:n.kind==='todo',reminder:n.kind==='reminder',project:n.kind==='project',later:n.status==='later',progress:n.status==='progress',today:dueState(n)==='today'}[f]??true))}
const filtering=()=>!!ui.q.trim()||ui.hideDone;
function visibleSet(){if(!filtering())return null;const Q=parseQ(ui.q),set=new Set();
  const walk=n=>{let any=false;n.children.forEach(c=>{const x=S.nodes[c];if(x&&walk(x))any=true});
    const m=n.id!=='root'&&matches(n,Q)&&!(ui.hideDone&&isClosed(n));if(m||any)set.add(n.id);return m||any};
  walk(S.nodes.root);return set}

  n.tags.slice(0,2).forEach(t=>b.push(`<span class="bd tag" data-tag="${esc(t)}" data-tip="Filter by #${esc(t)}">#${esc(t)}</span>`));

// first lines of the notes, for tooltips

// printable list: the entry and everything below it, through the browser print dialog (also "Save as PDF")
function printList(id){const r=S.nodes[id];if(!r)return;
  const pdt=s=>{const d=pd(s);return d?`${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}${s.includes('T')?' '+pad(d.getHours())+':'+pad(d.getMinutes()):''}`:''};

  const info=n=>`<span class="pm">${meta(n)}</span>${n.notes&&n.notes.trim()?`<div class="pt">${esc(notesTip(n))}</div>`:''}`;
  const box=n=>n.kind==='reminder'?'◷':n.status==='done'?'☑':isClosed(n)?'☒':'☐';

function progHTML(n){const k=kids(n);let label,f;
  if(k.length){f=frac(n);label=`${k.filter(c=>c.status==='done').length}/${k.length}`}
  else if(n.prog.mode==='units'){f=frac(n);label=`${n.prog.done}/${n.prog.total}${n.prog.unit?' '+esc(n.prog.unit):''}`}
  else if(n.prog.done>0||n.status==='done'){f=frac(n);label=Math.round(f*100)+'%'}else return'';
  return`<span class="prog ${f>=1?'full':''}" data-tip="${k.length?'Sub-items done / total (bar = average progress)':'Progress'}"><span class="bar"><i style="width:${Math.round(f*100)}%"></i></span>${label}</span>`}
function liHTML(n,vis,force){
  const open=!n.collapsed||force,kidsHtml=open?n.children.map(i=>S.nodes[i]).filter(c=>c&&(!vis||vis.has(c.id))).map(c=>liHTML(c,vis,force)).join(''):'';
  const hasKids=n.children.some(c=>!vis||vis.has(c)),cls=['row'];if(ui.sel===n.id)cls.push('sel');if(ui.multi.has(n.id))cls.push('multi');if(isClosed(n))cls.push('closed');if(blocked(n))cls.push('blocked');if(n.status==='later')cls.push('later');if(n.kind==='reminder'&&n.reminder&&!n.recur&&(evEnd(n)||remAt(n))<=new Date())cls.push('passed');if(n.kind==='project')cls.push('proj');
  const tip=n.kind==='idea'?'Idea — click to cycle raw ⇄ exploring':isClosed(n)?'Click to reopen':n.kind==='project'?'Project — click to complete':'Click to mark done';

<span class="grip" data-tip="Drag to move (or Alt+↑/↓, Tab / Shift+Tab)">${ic('grip')}</span>
<button class="tw ${hasKids?(open?'open':''):'none'}" data-tip="Expand / collapse">${ic('chev')}</button>
${n.kind==='reminder'?`<span class="rbell" data-tip="Reminder — no status to set. It pops up before and at the time.">${ic('bell',16)}</span>`:`<button class="chk st-${n.status} k-${n.kind}${projIc(n)?' has-ic':''}" data-tip="${tip} · ${STAT[n.status]}${STAT_TIP[n.status]?' — '+STAT_TIP[n.status]:''}">${projIc(n)}</button>`}
<span class="namewrap">${tagIc(n)}<span class="name" data-tip="${n.notes&&n.notes.trim()?esc(notesTip(n))+'\n\n':''}Double-click or F2 to rename · Alt+Enter to edit the notes">${esc(n.name)||'<i style="color:var(--muted)">Untitled</i>'}</span>${nameLink(n)}</span>

<button class="add" data-tip="Add sub-item (Insert)">${ic('plus')}</button><button class="more" data-tip="More actions (or right-click)">${ic('menu')}</button></div><ul class="children" data-id="${n.id}">${kidsHtml}</ul></li>`}
function renderTree(){
  // a search opens every branch to show its matches; "Hide done" only hides, so collapsing still works
  const vis=visibleSet(),force=!!ui.q.trim(),root=S.nodes.root;
  const html=root.children.map(i=>S.nodes[i]).filter(c=>c&&(!vis||vis.has(c.id))).map(c=>liHTML(c,vis,force)).join('');
  const el=$('#tree');sortables.forEach(s=>s.destroy());sortables=[];
  el.innerHTML=`<ul class="children root" data-id="root" style="padding-left:0!important">${html}</ul>`+((!html)?`<div class="empty">${filtering()?'Nothing matches this filter.':'Nothing here yet — type above to add your first item.'}</div>`:'');
  $$('.children',el).forEach(ul=>sortables.push(new Sortable(ul,{group:'tree',animation:130,handle:'.grip',ghostClass:'ghost',chosenClass:'chosen',fallbackOnBody:true,swapThreshold:.65,emptyInsertThreshold:16,
    delay:150,delayOnTouchOnly:true,touchStartThreshold:4,disabled:filtering(),
    onStart(){ui.dragging=true;document.body.classList.add('dragging')},

  s=s.replace(/\[icon:([a-z0-9-]+)\]/gi,(m,k)=>P[k.toLowerCase()]?`<span class="tic">${ic(k.toLowerCase(),16)}</span>`:m).replace(/\[br\]/gi,'<br>');
  const block=(t,fn)=>again(new RegExp(`\\n?\\[${t}\\]((?:(?!\\[${t}\\])[\\s\\S])*?)\\[\\/${t}\\]\\n?`,'gi'),(_,x)=>fn(x));

    case'reminder-d':case'reminder-t':m(()=>setDT(n,'reminder'));if($('[data-f=end-d]'))showEnd(n);break;// no re-render: it would break typing
    case'end-d':case'end-t':{const x=endInput(n);$$('[data-f^=end-]').forEach(i=>i.classList.toggle('bad',x.bad));if(!x.bad)m(()=>n.end=x.end);break}
    case'lead':m(()=>n.lead=+v,true);break;case'discord':m(()=>n.discord=t.checked,true);break;case'recur':if(v==='custom'){ui.rcEdit=n.id;renderDetail();break}ui.rcEdit=null;m(()=>n.recur=v,true);break;

    case'tagadd':case'peopleadd':{const arr=f==='tagadd'?n.tags:n.people;const items=v.split(',').map(s=>s.trim().replace(/^[#@]/,'')).filter(s=>s&&!arr.includes(s));if(items.length)m(()=>arr.push(...items),true);else t.value='';break}

function onDetailClick(e){const b=e.target.closest('[data-act]');if(!b)return;const n=S.nodes[ui.sel],a=b.dataset.act,v=b.dataset.v,i=+b.dataset.i;

/* ============================ today ============================ */
function trow(n){return`<div class="trow" data-goto="${n.id}" style="${n.color?`--c:${n.color}`:''}">${n.kind==='reminder'?`<span class="rbell">${ic('bell',16)}</span>`:`<button class="chk st-${n.status} k-${n.kind}" data-chk="${n.id}" data-tip="Toggle done"></button>`}<span>${tagIc(n)}${esc(n.name)}</span><span class="crumb">${esc(path(n))}</span><span class="sp"></span>${n.prio?`<span class="flag p${n.prio}">${ic('flag',14)}</span>`:''}${n.kind==='reminder'?`<span class="bd rem">${ic('bell',12)}${esc(whenRange(n))}</span>`:n.deadline?`<span class="bd ${dueState(n)==='over'?'over':dueState(n)==='today'?'today':''}">${esc(fmtWhen(n.deadline))}</span>`:''}</div>`}
// Today's plan, in minutes: the open estimates of the todos due today or overdue (minus tracked time), and
// the timed events in the rest of the work day, against the time left in it (Settings → Work day)
function dayPlan(){const wd=S.prefs.workDay||{from:'09:00',to:'17:00'},t0=startOfToday();
  const at=hm=>{const[h,m]=hm.split(':').map(Number);return new Date(t0.getFullYear(),t0.getMonth(),t0.getDate(),h,m).getTime()};
  const from=Math.max(now(),at(wd.from)),to=at(wd.to);
  const due=allNodes().filter(n=>n.kind==='todo'&&!isClosed(n)&&n.status!=='later'&&n.est>0&&['over','today'].includes(dueState(n)));
  const tasks=due.filter(n=>!due.some(m=>m!==n&&inSubtree(m.id,n.id)))// a parent and its sub-items: only the sub-items count
    .reduce((a,n)=>a+Math.max(0,n.est-n.time.reduce((s,t)=>s+t.secs,0)/60),0);
  const events=allNodes().filter(n=>n.kind==='reminder'&&n.end&&n.reminder.includes('T'))
    .reduce((a,n)=>a+Math.max(0,Math.min(evEnd(n),to)-Math.max(remAt(n),from))/6e4,0);
  return{left:Math.max(0,to-from)/6e4,tasks,events}}
function planBar(){const{left,tasks,events}=dayPlan(),plan=tasks+events;if(!plan)return'';
  const over=plan-left,w=x=>(x/Math.max(left,plan)*100).toFixed(1)+'%',d=x=>fmtDur(x*60);
  return`<div class="plan${over>0?' over':''}"><div class="row-between"><span><b>Planned ${d(plan)}</b> · ${left?d(left)+' left in the work day':'the work day is over'}</span><span>${over>0?`<b>${d(over)} too much</b>`:d(-over)+' free'}</span></div>
<div class="planbar"><i class="ev" style="width:${w(events)}" data-tip="Events: ${d(events)}"></i><i class="tk" style="width:${w(tasks)}" data-tip="Todos due today or overdue (estimate minus time tracked): ${d(tasks)}"></i>${over>0&&left?`<b style="left:${w(left)}" data-tip="End of the work day"></b>`:''}</div></div>`}
function renderToday(){
  const A=allNodes().filter(n=>!isClosed(n)&&n.kind==='todo'&&n.status!=='later'),used=new Set();
  const sec=(title,list,hint)=>{list=list.filter(n=>!used.has(n.id));list.forEach(n=>used.add(n.id));return list.length?`<h2>${title}<small>${list.length}${hint?' · '+hint:''}</small></h2>${list.map(trow).join('')}`:''};
  const rem=A.filter(n=>n.reminder&&remAt(n)<=now());
  const wk=startOfToday().getTime()+7*864e5,upc=allNodes().filter(n=>n.kind==='reminder'&&n.reminder&&(n.end?evEnd(n)>startOfToday():remAt(n)>=startOfToday())&&remAt(n).getTime()<wk).sort((a,b)=>remAt(a)-remAt(b));
  const html=sec('Upcoming reminders',upc,'next 7 days')+sec('Overdue',A.filter(n=>dueState(n)==='over'))+sec('Due today',A.filter(n=>dueState(n)==='today'))+sec('Reminders',rem)+sec('In progress',A.filter(n=>n.status==='progress'))
   +sec('Due soon',A.filter(n=>n.deadline&&dueState(n)==='soon'&&(pd(n.deadline)-now())<7*864e5).sort((a,b)=>pd(a.deadline)-pd(b.deadline)))
   +sec('Next up',A.filter(n=>n.prio>=3&&!blocked(n)&&!n.children.length),'high priority, not blocked');
  $('#vToday').innerHTML=`<div class="page"><h2 style="margin-top:4px;font-size:20px">Today <small>${DOW[new Date().getDay()]} ${new Date().getDate()} ${MON[new Date().getMonth()]}</small></h2>${planBar()}${html||'<div class="empty">Nothing urgent. Enjoy the calm — or pick something from the tree.</div>'}</div>`}

/* ============================ stats ============================ */
const MET={closed:['Closed','items completed'],created:['Created','items created'],activity:['Activity','changes'],time:['Time','minutes tracked']};
const mval=(a,m)=>m==='closed'?+(a.type==='close'):m==='created'?+(a.type==='create'):m==='time'?(a.type==='time'?a.secs/60:0):+(a.type!=='time');
function renderStats(){
  const m=ui.metric,byDay={},grid=Array.from({length:7},()=>Array(24).fill(0)),A=S.activity;
  A.forEach(a=>{const v=mval(a,m);if(!v)return;const k=dayKey(a.t);byDay[k]=(byDay[k]||0)+v;const d=new Date(a.t);grid[(d.getDay()+6)%7][d.getHours()]+=v});
  const end=startOfToday(),wd=(end.getDay()+6)%7,start=new Date(end);start.setDate(start.getDate()-wd-52*7);
  const max=Math.max(1,...Object.values(byDay)),lvl=v=>!v?0:Math.min(4,Math.ceil(4*v/max));
  const unit=MET[m][1],fmt=v=>m==='time'?fmtDur(v*60):Math.round(v*10)/10;
  let cells='',months='',total=0;
  for(let w=0;w<53;w++)for(let d=0;d<7;d++){const dt=new Date(start);dt.setDate(start.getDate()+w*7+d);if(dt>end)continue;const k=dayKey(dt),v=byDay[k]||0;total+=v;
    cells+=`<rect class="hm${lvl(v)}" x="${30+w*15}" y="${18+d*15}" width="12" height="12" rx="3" data-tip="${v?fmt(v)+' '+unit:'No '+unit} · ${DOW[dt.getDay()]} ${dt.getDate()} ${MON[dt.getMonth()]} ${dt.getFullYear()}"/>`;
    if(d===0&&dt.getDate()<=7)months+=`<text x="${30+w*15}" y="10">${MON[dt.getMonth()]}</text>`}
  const days=['Mon','','Wed','','Fri','',''].map((l,i)=>l?`<text x="0" y="${28+i*15}">${l}</text>`:'').join('');
  const gmax=Math.max(1,...grid.flat()),gl=v=>!v?0:Math.min(4,Math.ceil(4*v/gmax));
  let g='';for(let d=0;d<7;d++){g+=`<text x="0" y="${30+d*22}">${DOW[(d+1)%7]}</text>`;for(let h=0;h<24;h++)g+=`<rect class="hm${gl(grid[d][h])}" x="${34+h*22}" y="${16+d*22}" width="19" height="19" rx="4" data-tip="${grid[d][h]?fmt(grid[d][h])+' '+unit:'No '+unit} · ${DOW[(d+1)%7]} ${pad(h)}:00"/>`}
  for(let h=0;h<24;h+=3)g+=`<text x="${34+h*22}" y="10">${pad(h)}</text>`;
  const open=allNodes().filter(n=>n.kind!=='project'&&n.kind!=='reminder'&&!isClosed(n)&&n.status!=='later').length,over=allNodes().filter(n=>dueState(n)==='over').length;
  const wk=new Date(end);wk.setDate(wk.getDate()-wd);
  const closedWeek=A.filter(a=>a.type==='close'&&a.t>=wk).length,timeWeek=A.filter(a=>a.type==='time'&&a.t>=wk).reduce((s,a)=>s+a.secs,0);
  let streak=0;const cd={};A.forEach(a=>{if(a.type==='close')cd[dayKey(a.t)]=1});const d=new Date(end);if(!cd[dayKey(d)])d.setDate(d.getDate()-1);while(cd[dayKey(d)]){streak++;d.setDate(d.getDate()-1)}
  const cyc=[];allNodes().forEach(n=>{const a=n.hist.find(h=>h.s==='progress'),b=n.hist.slice().reverse().find(h=>h.s==='done');if(a&&b&&b.at>a.at)cyc.push(b.at-a.at)});
  const tagc={};A.filter(a=>a.type==='close').forEach(a=>{const n=S.nodes[a.id];n&&n.tags.forEach(t=>tagc[t]=(tagc[t]||0)+1)});
  const tags=Object.entries(tagc).sort((a,b)=>b[1]-a[1]).slice(0,8),tmax=tags[0]?.[1]||1;
  $('#vStats').innerHTML=`<div class="page">
<div class="row-between"><h2 style="margin:4px 0;font-size:20px">Statistics</h2><div class="seg">${Object.entries(MET).map(([k,v])=>`<button data-metric="${k}" class="${m===k?'on':''}" data-tip="Show ${v[1]} per day">${v[0]}</button>`).join('')}</div></div>
<div class="tiles" style="margin-top:12px"><div class="tile"><b>${open}</b><span>open items</span></div><div class="tile"><b>${closedWeek}</b><span>closed this week</span></div><div class="tile"><b>${over}</b><span>overdue</span></div><div class="tile"><b>${fmtDur(timeWeek)}</b><span>tracked this week</span></div><div class="tile"><b>${streak}</b><span>day streak (closing)</span></div><div class="tile"><b>${cyc.length?fmtDur(cyc.reduce((a,b)=>a+b,0)/cyc.length/1000):'–'}</b><span>avg. start → done</span></div></div>
<h2>${fmt(total)} ${unit} in the last year</h2>
<div class="card"><svg width="${30+53*15}" height="${18+7*15}">${months}${days}${cells}</svg><div class="legend">Less ${[0,1,2,3,4].map(i=>`<i class="hm${i}" style="background:var(--hm${i})"></i>`).join('')} More</div></div>
<h2>When is work done? <small>weekday × hour of day</small></h2>
<div class="card"><svg width="${34+24*22}" height="${16+7*22}">${g}</svg></div>
<h2>Closed by tag</h2><div class="card">${tags.length?tags.map(([t,c])=>`<div class="hbar"><span>#${esc(t)}</span><div><i style="width:${c/tmax*100}%"></i></div><b>${c}</b></div>`).join(''):'<span style="color:var(--muted)">No closed items with tags yet.</span>'}</div></div>`}

/* ============================ timer / reminders / alarm ============================ */
let ac,alarmIv,titleIv,tc=0;
function ensureAudio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch{}}
function beep(){if(!ac)return;const t=ac.currentTime;[0,.28,.56].forEach(d=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=d===.56?1175:880;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.35,t+d+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d+.22);o.connect(g).connect(ac.destination);o.start(t+d);o.stop(t+d+.25)})}
function notify(title,body){try{if('Notification'in window&&Notification.permission==='granted')new Notification(title,{body})}catch{}}
function ring(){ensureAudio();beep();clearInterval(alarmIv);alarmIv=setInterval(beep,2200);const t0=document.title;let f=0;clearInterval(titleIv);titleIv=setInterval(()=>document.title=(f^=1)?'⏰ Time is up!':t0,800);
  const T=S.timer,n=T&&S.nodes[T.id];notify('Time is up',n?n.name:'Timer finished');showAlarm()}
function stopAlarm(){clearInterval(alarmIv);clearInterval(titleIv);titleIv=null;document.title=pageTitle()}
// the browser tab shows the one most important thing: a running timer, a reminder that pops up,
// overdue todos, or the next todo due today; else the app name
function pageTitle(){const T=S.timer;
  if(T&&!(T.end&&T.alarmed)){const n=S.nodes[T.id];return`⏱ ${T.end?fmtClock((T.end-now())/1000):fmtClock(elapsedSec())}${n?' · '+n.name:''}`}
  const r=remQ.length&&S.nodes[remQ[0].id];if(r)return'🔔 '+r.name;
  const A=allNodes().filter(n=>n.kind==='todo'&&!isClosed(n)&&n.status!=='later'),over=A.filter(n=>dueState(n)==='over').length;
  if(over)return`⚠ ${over} overdue · ${APP.name}`;
  const d=A.filter(n=>dueState(n)==='today').sort((a,b)=>pd(a.deadline)-pd(b.deadline))[0];
  if(d)return`📅 ${d.deadline.includes('T')?d.deadline.slice(11)+' ':'Today: '}${d.name} · ${APP.name}`;
  return APP.name+' '+APP.version}
function showAlarm(){const T=S.timer;if(!T)return;const n=S.nodes[T.id];
  openModal(`<div style="text-align:center"><div style="font-size:42px">⏰</div><h3 style="margin:4px 0">Time is up!</h3><p style="color:var(--muted)">${T.min} minute${T.min>1?'s':''}${n?` on “${esc(n.name)}”`:''}</p>
  <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn pri" data-t="stop">${n?'Log time & close':'Close'}</button><button class="btn" data-t="plus5">+5 min</button><button class="btn" data-t="plus15">+15 min</button><button class="btn dng" data-t="discard">Discard</button></div></div>`,{cls:'center',kind:'alarm'})}
function startTimer(min,id){if(S.timer)stopTimer(true);S.timer={id:id||null,start:now(),end:min?now()+min*60000:null,min:min||0,alarmed:false};ensureAudio();
  if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();persist();closeModal();renderTimerBtn();toast(min?`Timer started: ${min} min`:'Stopwatch started')}
const elapsedSec=()=>{const T=S.timer;return Math.max(0,((T.end&&now()>T.end?T.end:now())-T.start)/1000)};
function stopTimer(logIt){const T=S.timer;if(!T)return;const secs=Math.round(elapsedSec()),n=S.nodes[T.id];S.timer=null;stopAlarm();
  if(logIt&&secs>=30){if(n){push();n.time.push({at:now(),secs});n.updated=now();toast(`Logged ${fmtDur(secs)} on “${n.name}”`)}log('time',T.id,{secs})}
  persist();closeModal();renderTimerBtn();renderTree();renderDetail()}
function extendTimer(min){const T=S.timer;if(!T)return;T.end=Math.max(T.end||now(),now())+min*60000;T.min+=min;T.alarmed=false;stopAlarm();persist();closeModal();renderTimerBtn()}
function renderTimerBtn(){const b=$('#btnTimer'),T=S.timer;b.className='ib'+(T?(T.end&&T.alarmed?' up':' run'):'');
  if(!T)b.innerHTML=ic('clock');else{const n=S.nodes[T.id];b.innerHTML=ic('clock')+`<span>${T.end?(T.alarmed?'Time is up':fmtClock((T.end-now())/1000)):fmtClock(elapsedSec())}</span>`}}
function openTimer(preId){const T=S.timer,sel=preId||ui.sel;
  if(T){const n=S.nodes[T.id];openModal(`<div class="bigclock" id="tclock"></div><div style="text-align:center;color:var(--muted)">${n?'Working on “'+esc(n.name)+'”':'No task attached'} · ${T.end?T.min+' min countdown':'stopwatch'}</div>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap"><button class="btn pri" data-t="stop" data-tip="Stop and add the elapsed time to the task">Stop & log</button>${T.end?'<button class="btn" data-t="plus5">+5 min</button>':''}<button class="btn dng" data-t="discard" data-tip="Stop without logging">Discard</button></div>`,{cls:'pop-right',kind:'timer'});updateClock()}
  else openModal(`<b>Start a timer</b><div class="presets">${[15,25,45,60,90].map(m=>`<button class="btn" data-t="go" data-m="${m}">${m} min</button>`).join('')}</div>
    <div class="stepper"><input type="number" id="tmin" min="1" max="600" placeholder="custom minutes" style="flex:1"><button class="btn pri" data-t="go" data-m="custom" data-tip="Start the countdown">Go</button></div>
    <label class="field" style="margin-top:10px"><span>Log the time to</span><select id="ttask"><option value="">— nothing —</option>${allNodes().filter(x=>!isClosed(x)&&x.kind!=='reminder').map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(path(x)?path(x)+' › ':'')+esc(x.name)}</option>`).join('')}</select></label>
    <button class="btn" data-t="sw" style="margin-top:10px;width:100%" data-tip="Count up with no limit">Start stopwatch instead</button>`,{cls:'pop-right',kind:'timerset'})}
function updateClock(){const T=S.timer,c=$('#tclock');if(!c||!T)return;c.textContent=T.end?(T.alarmed?'0:00':fmtClock((T.end-now())/1000)):fmtClock(elapsedSec())}
function timerClick(e){const b=e.target.closest('[data-t]');if(!b)return;const a=b.dataset.t;
  if(a==='go'){const m=b.dataset.m==='custom'?+$('#tmin').value:+b.dataset.m;if(m>0)startTimer(m,$('#ttask').value)}
  else if(a==='sw')startTimer(0,$('#ttask').value);else if(a==='stop')stopTimer(true);else if(a==='discard')stopTimer(false);
  else if(a==='plus5')extendTimer(5);else if(a==='plus15')extendTimer(15)}
const remAt=n=>{const d=pd(n.reminder);if(d&&!n.reminder.includes('T'))d.setHours(9);return d};
// end of an event (a date-only end lasts to the end of that day), or null
const evEnd=n=>{const d=pd(n.end);if(d&&!n.end.includes('T'))d.setDate(d.getDate()+1);return d};

function seedActivity(){const ids=Object.keys(S.nodes).filter(i=>i!=='root'),out=[];let sd=7;const r=()=>(sd=sd*16807%2147483647)/2147483647,end=startOfToday();
  for(let d=300;d>=0;d--){const dt=new Date(end);dt.setDate(dt.getDate()-d);const we=dt.getDay()%6===0,w=we?.25:1;if(r()>.82*w+.1)continue;const n=Math.floor(r()*r()*9*w)+1;
    for(let i=0;i<n;i++){const h=Math.min(23,Math.max(6,Math.round(9+r()*9+(r()<.15?5:0)))),tt=new Date(dt);tt.setHours(h,Math.floor(r()*60),0,0);if(+tt>now())continue;const id=ids[Math.floor(r()*ids.length)],x=r();
      out.push(x<.25?{t:+tt,id,type:'create'}:x<.5?{t:+tt,id,type:'close'}:x<.65?{t:+tt,id,type:'time',secs:Math.round((10+r()*80)*60)}:{t:+tt,id,type:x<.85?'edit':'progress'})}}
  return out.sort((a,b)=>a.t-b.t)}

  if(ctrl&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return}
  if(ctrl||modalKind)return;

  if(e.key==='ArrowDown'){e.preventDefault();if(e.altKey&&n)reorder(n.id,1);else go(i+1)}
  else if(e.key==='ArrowUp'){e.preventDefault();if(e.altKey&&n)reorder(n.id,-1);else go(i<0?0:i-1)}

  const list=Object.entries(c).sort((a,b)=>b[1]-a[1]).map(e=>e[0]).filter(t=>!N.every(n=>n.tags.includes(t))).slice(0,8).map(t=>mi('#'+t,()=>addTag(N,t)));
  return[...list,...(list.length?[MSEP]:[]),mi('New tag…',()=>addTag(N,prompt('New tag:')))]}
function rmTag(N,t){mutate(()=>N.forEach(n=>{const i=n.tags.indexOf(t);if(i>=0){n.tags.splice(i,1);touch(n)}}),{panel:true})}
function addPerson(N,p){p=(p||'').trim().replace(/^@/,'');if(!p)return;mutate(()=>N.forEach(n=>{if(!n.people.includes(p)){n.people.push(p);touch(n)}}),{panel:true})}
function personItems(N){const c={};allNodes().forEach(x=>x.people.forEach(p=>c[p]=(c[p]||0)+1));
  const list=Object.entries(c).sort((a,b)=>b[1]-a[1]).map(e=>e[0]).filter(p=>!N.every(n=>n.people.includes(p))).slice(0,8).map(p=>mi(p,()=>addPerson(N,p)));
  return[...list,...(list.length?[MSEP]:[]),mi('New person…',()=>addPerson(N,prompt('Person in charge:')))]}
const focusField=(id,f)=>()=>{ui.sel=id;ui.panel=true;renderTree();renderDetail();setTimeout(()=>{const el=$(`[data-f="${f}"]`);if(el){el.focus();try{el.showPicker&&el.showPicker()}catch{}}},30)};
function nodeMenu(n){const id=n.id,sibs=S.nodes[n.parent].children,i=sibs.indexOf(id),kind=n.kind,isRem=kind==='reminder',url=openUrl(n);
  const doM=fn=>()=>mutate(fn,{panel:true});
  const items=[mi('Open details',()=>{ui.sel=id;ui.panel=true;renderTree();renderDetail()}),mi('Rename',()=>{ui.sel=id;rename(id)},{key:'F2'}),
    mi('Add sub-item',()=>newAndRename(id),{key:'Ins'}),
    mi('Add sibling below',()=>newAndRename(n.parent,i+1,kind==='project'?{kind:'project',status:'planning'}:undefined),{key:'Enter'}),MSEP];
  if(!isRem){
    const st=KS[kind].map(s=>mi(STAT[s]+(s==='later'?' (postponed)':''),doM(()=>setStatus(n,s)),{checked:n.status===s}));
    if(kind==='idea')st.push(MSEP,mi('Promote to todo',doM(()=>{n.kind='todo';n.status='open';n.hist.push({s:'open',at:now()});log('status',id,{s:'open'})})));
    items.push(msub('Status',st),msub('Priority',PRIO.map((l,k)=>mi(l,doM(()=>{n.prio=k;touch(n)}),{checked:n.prio===k}))));
  }
  items.push(colorSub([n]),msub('Change type',[['todo','Todo'],['idea','Idea'],['project','Project'],['reminder','Reminder']].map(([v,l])=>mi(l,doM(()=>setKind(n,v)),{checked:kind===v}))));
  if(!isRem){const setDay=d=>doM(()=>{const t=(n.deadline||'').split('T')[1];n.deadline=d?(t?d+'T'+t:d):'';touch(n)});
    items.push(msub('Deadline',[mi('Today',setDay(addDays(0))),mi('Tomorrow',setDay(addDays(1))),mi('In a week',setDay(addDays(7))),mi('Pick a date…',focusField(id,'deadline-d')),MSEP,mi('Clear deadline',setDay(''),{dis:!n.deadline})]))}
  else items.push(mi('Set date & time…',focusField(id,'reminder-d')));
  items.push(msub('Add tag',tagItems([n])),MSEP,mi('Move to…',()=>openMoveTo([id])),
    mi('Move up',()=>reorder(id,-1),{key:'Alt+↑',dis:i<=0}),mi('Move down',()=>reorder(id,1),{key:'Alt+↓',dis:i>=sibs.length-1}),
    mi('Indent',()=>indent(id),{key:'Tab',dis:i<1}),mi('Outdent',()=>outdent(id),{key:'Shift+Tab',dis:n.parent==='root'}));
  if(n.children.length)items.push(mi('Collapse all below',()=>setBelow(id,true)),mi('Expand all below',()=>setBelow(id,false)));
  items.push(MSEP);
  if(url)items.push(mi('Open link',()=>window.open(url,'_blank','noopener')));
  if(!isRem)items.push(mi('Start timer on this',()=>openTimer(id)));
  if(kind==='todo'&&projectOf(n))items.push(mi('Announce on Discord…',()=>{annQueue=[id];showAnn()}));
  items.push(mi('Print list…',()=>printList(id)),mi('Copy as text',()=>copyText(n.name+(safeUrl(n.url)?'\n'+n.url:''))),mi('Copy ID',()=>copyText(id)),MSEP,
    mi('Duplicate',()=>dupAction(id)),mi('Move to trash',()=>trash(id),{danger:true,key:'Del'}));
  return items}
function bulkMenu(ids){const N=ids.map(i=>S.nodes[i]).filter(Boolean),doM=fn=>()=>mutate(fn,{panel:true});
  // statuses of all selected kinds; each entry only takes the ones its kind has
  const sts=[...new Set(N.filter(n=>n.kind!=='reminder').flatMap(n=>KS[n.kind]))],tags=[...new Set(N.flatMap(n=>n.tags))].sort();
  return[mi(`${N.length} entries selected`,()=>{},{dis:true}),MSEP,
    mi('Mark done',doM(()=>N.forEach(n=>n.kind!=='reminder'&&setStatus(n,'done')))),
    msub('Status',sts.map(s=>mi(STAT[s]+(s==='later'?' (postponed)':''),doM(()=>N.forEach(n=>KS[n.kind].includes(s)&&setStatus(n,s))))),{dis:!sts.length}),
    msub('Priority',PRIO.map((l,k)=>mi(l,doM(()=>N.forEach(n=>{n.prio=k;touch(n)}))))),
    colorSub(N),msub('Add tag',tagItems(N)),msub('Remove tag',tags.map(t=>mi('#'+t,()=>rmTag(N,t))),{dis:!tags.length}),
    msub('Add person',personItems(N)),mi('Move to…',()=>openMoveTo(ids)),MSEP,
    mi('Move to trash',()=>trash(ids),{danger:true}),mi('Clear selection',()=>{ui.multi.clear();renderTree()})]}
function openRowMenu(id,x,y){const n=S.nodes[id];if(!n)return;
  if(ui.multi.size>1&&ui.multi.has(id)){showCtx(bulkMenu([...ui.multi]),x,y);return}
  ui.multi.clear();if(ui.sel!==id){ui.sel=id;renderTree();renderDetail()}showCtx(nodeMenu(n),x,y)}
function openMoveTo(ids){moveIds=ids;
  openModal(`<h3 style="margin-top:0">Move ${ids.length>1?ids.length+' entries':'“'+esc(S.nodes[ids[0]].name)+'”'} to…</h3><input id="mvq" placeholder="Search a project or entry…" autocomplete="off" style="width:100%"><div class="list" id="mvl" style="margin-top:8px;max-height:50vh;overflow:auto"></div>`,{kind:'moveto'});
  const inp=$('#mvq'),draw=()=>{const q=inp.value.toLowerCase().trim();
    const c=allNodes().filter(x=>x.kind!=='reminder'&&!moveIds.some(i=>inSubtree(x.id,i))).map(x=>({x,l:(path(x)?path(x)+' › ':'')+x.name})).filter(o=>!q||o.l.toLowerCase().includes(q))
      .sort((a,b)=>(b.x.kind==='project')-(a.x.kind==='project')||a.l.localeCompare(b.l)).slice(0,60);
    $('#mvl').innerHTML=`<button class="btn" data-mv="root" style="text-align:left">⬆ Top level</button>`+c.map(o=>`<button class="btn" data-mv="${o.x.id}" style="text-align:left">${esc(o.l)}${o.x.kind==='project'?' <small style="color:var(--muted)">project</small>':''}</button>`).join('')};
  inp.oninput=draw;draw();inp.focus()}
$('#modal').addEventListener('click',e=>{const b=e.target.closest('[data-mv]');if(!b||modalKind!=='moveto')return;const tid=b.dataset.mv,ids=moveIds.slice();closeModal();
  mutate(()=>{ids.forEach(i=>moveNode(i,tid));if(tid!=='root')S.nodes[tid].collapsed=false},{panel:true});
  toast(`Moved ${ids.length} entr${ids.length>1?'ies':'y'} to ${tid==='root'?'top level':'“'+S.nodes[tid].name+'”'}`,{action:{label:'Undo',fn:undo}})});
$('#tree').addEventListener('contextmenu',e=>{const row=e.target.closest('.row');if(!row||e.target.closest('input'))return;e.preventDefault();openRowMenu(row.parentElement.dataset.id,e.clientX,e.clientY)});
let lpT;
$('#tree').addEventListener('touchstart',e=>{const row=e.target.closest('.row');if(!row||e.touches.length!==1||e.target.closest('.grip,input,a,.chk,.tw,.add,.more'))return;
  const t=e.touches[0],x=t.clientX,y=t.clientY;clearTimeout(lpT);lpT=setTimeout(()=>openRowMenu(row.parentElement.dataset.id,x+6,y+6),520)},{passive:true});
['touchmove','touchend','touchcancel'].forEach(ev=>$('#tree').addEventListener(ev,()=>clearTimeout(lpT),{passive:true}));

/* ============================ init ============================ */
(async function init(){
  try{const st=await Store.api('GET','/api/state');Store.adopt(st);APP.name=st.info.name;APP.version='v'+st.info.version;
    if(st.recovered)setTimeout(()=>toast('Data was recovered: '+st.recovered,{ms:25000}),600)}
  catch(e){document.body.innerHTML=`<div style="padding:40px;font:16px system-ui;max-width:560px"><h2>Cannot reach the Todo server</h2><p>${esc(e.message)}</p><p>Start it with <code>todo serve</code> and reload this page.</p><button onclick="location.reload()" style="padding:8px 16px;font:inherit">Retry</button></div>`;return}
  document.title=APP.name+' '+APP.version;$('.brand small').textContent=APP.version;applyPrefs();applyTheme();setView('tree');renderTimerBtn();chrome();
  Store.connect();setInterval(tick,1000);setTimeout(syncAlerts,800);
  if(S.timer&&S.timer.alarmed)showAlarm();
  if(Object.keys(S.nodes).length<=1&&!S.prefs.welcomed){S.prefs.welcomed=true;persist();setTimeout(()=>toast('Welcome! Type in the quick-add field above, or open ⋯ → Load demo data for an example.',{ms:14000}),700)}
})();
</script>
